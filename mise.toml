[settings]
lockfile = true
lockfile_platforms = ["macos-arm64", "linux-x64"]

[tool_alias]
weasyprint = "trans-nix:weasyprint[package='python314Packages.weasyprint']"

[tools]
python = "latest"
pandoc = "latest"
weasyprint = "latest"

[plugins]
trans-nix = "https://github.com/igor-makarov/trans-nix#1.1.0"

[tasks.build]
description = "Build the website, one-page A4 PDF, and DOCX"
run = "./build.sh"

[tasks.clean]
description = "Remove generated files"
run = "rm -rf .build site"
