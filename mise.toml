[settings]
lockfile = true
lockfile_platforms = ["macos-arm64", "linux-x64"]

[tools]
python = "latest"
pandoc = "latest"
"pipx:weasyprint" = "latest"

[env]
WEASYPRINT_DYLD_FALLBACK_LIBRARY_PATH = "/opt/homebrew/lib"

[bootstrap.packages]
"apt:libpango-1.0-0" = "latest"
"apt:libpangoft2-1.0-0" = "latest"
"brew:pango" = "latest"

[tasks.build]
description = "Build the website, one-page A4 PDF, and DOCX"
run = "./build.sh"

[tasks.clean]
description = "Remove generated files"
run = "rm -rf .build site"
