name: Build and publish CV

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: cv-build
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up tools with mise
        uses: jdx/mise-action@v3
        with:
          install: true
          cache: true

      - name: Install native WeasyPrint libraries with mise
        run: mise bootstrap packages install --yes --update

      - name: Build and verify all formats
        run: mise run build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@v4
